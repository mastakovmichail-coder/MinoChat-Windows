name: Build MinoChat EXE
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      - run: npm run pack
      - name: Copy app into installer
        shell: bash
        run: cp -r dist/win-unpacked installer/app
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Inno Setup installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MinoChat.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: MinoChat-Installer
          path: installer/Output/MinoChat-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MinoChat-Windows-Setup
          path: dist/MinoChat-Windows-Setup.exe
      - name: Publish to GitHub Releases (the site button downloads this file)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MinoChat for Windows
          files: dist/MinoChat-Windows-Setup.exe
          make_latest: true
